[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-dl-ultra"
dynamic = ["version"]
description = "Versão Ultra de downloads de música do Qobuz, Lossless com metadados ReplayGain e Classical"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "Eduardo (kaduvercosa)", email = "kaduvercosa@users.noreply.github.com" }
]

keywords = [
    "qobuz",
    "music",
    "downloader",
    "flac",
    "hi-res",
    "lossless"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent"
]

dependencies = [
    "pathvalidate",
    "httpx",
    "aiosqlite",
    "send2trash",
    "humanize",
    "aiofiles",
    "tenacity",
    "platformdirs",
    "charset_normalizer",
    "mutagen",
    "tqdm",
    "prompt_toolkit",
    "packaging",
    "colorama>=0.4.6",
    "cryptography",
    "keyring",
]

[project.optional-dependencies]
speed = [
    "rapidfuzz",
    "brotli",
]
covers = [
    "Pillow>=10.0.0",
]
watch = [
    "watchdog",
]
duplicates = [
    "pyacoustid",
]
genius = [
    "lyricsgenius>=3.0; python_version >= '3.11'",
    "lyricsgenius>=3.0,<3.7.4; python_version < '3.11'",
]
analyze = [
    "numpy",
]
all = [
    "qobuz-dl-ultra[speed,covers,watch,duplicates,genius,analyze]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Repository = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Issues = "https://github.com/kaduvercosa/qobuz-dl-ultra/issues"

[project.scripts]
qobuz-dl = "qobuz_dl:main"
qdl = "qobuz_dl:main"

[tool.setuptools.dynamic]
version = { attr = "qobuz_dl.__version__" }

[tool.setuptools.packages.find]
include = ["qobuz_dl*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

norecursedirs = ["manual", ".git", "__pycache__", "build", "dist"]
addopts = """
    -ra
    --strict-markers
    --strict-config
    --tb=short
    -v
"""
# -v      -> nome completo de cada teste (TestClasse::test_metodo) com PASSED/FAILED
# -ra     -> resumo de tudo que nao passou (skips, falhas, erros) no final
# --tb=short -> traceback curto: so a linha que falhou + o assert, sem todo
#              o frame interno do pytest que nao diz nada ao desenvolvedor

markers = [
    "slow: abre subprocesso ou espera I/O real; pule com -m 'not slow' no dia a dia",
    "integration: toca o sistema de arquivos real ou a API; requer credenciais",
    "asyncio: marca corotinas de teste (gerenciado automaticamente pelo pytest-asyncio)",
    # Marcadores de categoria, um por subpasta de tests/ -- permitem
    # `pytest -m ui` / `pytest -m network` etc. além de já separar
    # visualmente na coleta (tests/unit/..., tests/network/...).
    "unit: logica pura, sem rede/subprocess/arquivo -- deve rodar em milissegundos",
    "network: exercita a camada HTTP via pytest-httpx (mockado, nunca toca rede real)",
    "ui: saida de terminal -- quebra de linha, largura, concorrencia entre logging e tqdm",
    "regression: trava um bug historico especifico (ver a docstring do arquivo)",
    "lyrics: busca/processamento/formatacao de letras (Qobuz e Genius)",
]

asyncio_mode = "auto"

# Filtra avisos barulhentos que nao sao bugs do projeto
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:tqdm",
    "ignore::PendingDeprecationWarning",
]

# Exibe os 10 testes mais lentos quando a suite inteira roda
# (util para perceber quando um teste unitario virou lento sem querer)
# Ative com: pytest --durations=10
# durations = 10

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C", "T"]

ignore = [
  "T201",
  "E203", "E266",
  "W291", "W293",
  "E226", "E731", "E741",
  "E501",
  "F541", "F841", "E402",
  "C901",
  "C414",
  "C408",
  "B905",
]

[tool.ruff.lint.mccabe]
max-complexity = 55

[tool.ruff.lint.per-file-ignores]
"downloader.py" = ["F401"]
"core.py" = ["F401"]
