[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-dl-ultra"
dynamic = ["version"]
description = "The Ultimate Lossless and Hi-Res music downloader for Qobuz with ReplayGain and Classical metadata"
readme = "README.md"
# Historico: declarava ">=3.6", uma versao em que o projeto NAO roda
# (usa f-strings com "=", walrus, dict ordenado, asyncio moderno, type
# hints PEP 585/604...). Pip instalava alegremente em 3.6/3.7/3.8 e o
# usuario recebia SyntaxError. Corrigido para ">=3.9" antes.
#
# Agora >=3.10, e o motivo e concreto: o mutagen 1.48.0 removeu suporte
# a 3.9 ("Drop Support for Python 3.7, 3.8 and 3.9" no changelog) e a
# versao atual declara >=3.10. Enquanto isto dizia ">=3.9", quem
# instalasse em 3.9 recebia SILENCIOSAMENTE o mutagen 1.47.0 -- ou seja,
# rodava uma combinacao que nunca foi testada, enquanto o
# desenvolvimento testava a 1.48.x. Melhor declarar a verdade.
# O a-Shell no iPad traz Python 3.11, entao nada se perde ali.
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "Eduardo (kaduvercosa)", email = "kaduvercosa@users.noreply.github.com" }
]

keywords = [
    "qobuz",
    "music",
    "downloader",
    "flac",
    "hi-res",
    "lossless"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent"
]

dependencies = [
    # ------------------------------------------------------------------
    # NUCLEO: sem isto o programa nao importa. Confirmado por teste
    # (tests/test_dependencias.py) que bloqueia cada pacote e tenta
    # importar o CLI -- nao por leitura de codigo.
    #
    # REGRA que motivou a reorganizacao desta lista: o a-Shell (iOS/iPadOS)
    # so' instala pacotes Python PUROS via pip -- "only if they are pure
    # Python", diz o README dele. Qualquer pacote COMPILADO aqui no nucleo
    # torna o programa impossivel de instalar no iPad. Entao pacote
    # compilado so' entra no nucleo se for insubstituivel.
    # ------------------------------------------------------------------
    "pathvalidate",
    "httpx",
    "aiosqlite",  # ver db.py: handle_download_id() e' chamado por
                  # faixa/album baixado, sqlite3 sincrono travava o event
                  # loop a cada escrita
    "send2trash",  # ver downloader.py: manda arquivos parciais pra
                   # lixeira do SO em vez de apagar de vez
    "humanize",  # formatacao de tamanho/tempo legivel na UI
    "aiofiles",
    "tenacity",
    "platformdirs",
    "charset_normalizer",
    "mutagen",
    "tqdm",
    "questionary",
    "prompt_toolkit",
    "packaging",  # comparacao de versao conforme a especificacao da PyPA.
                  # BUGFIX: substitui `tuple(map(int, v.split(".")))` em
                  # cli.py, que levantava ValueError em qualquer tag nao
                  # numerica ("2.5.0-rc1") e, por estar dentro de um
                  # `except Exception: pass`, fazia o aviso de atualizacao
                  # nunca aparecer. Puro Python, sem dependencias.
    "colorama>=0.4.6",  # just_fix_windows_console() so existe a partir da
                        # 0.4.6 (ver color.py). Sem o pino, uma instalacao
                        # com colorama antigo quebra no import.

    # O UNICO pacote compilado que sobra no nucleo. E' insubstituivel:
    # qopy.py usa HKDF + AES pra derivar as chaves da API do Qobuz e
    # downloader.py descriptografa o stream. Nao ha equivalente na
    # biblioteca padrao.
    #
    # DE PROPOSITO SEM PISO DE VERSAO -- nao adicione um. O a-Shell embute
    # o cryptography como framework pre-compilado numa versao antiga, e
    # `pip install --upgrade cryptography` la' instala um wheel que falha
    # no dlopen (ver github.com/holzschu/a-shell/issues/797). Sem piso, o
    # pip aceita o que ja' esta instalado e o programa roda. Com piso, o
    # pip forca um upgrade que quebra o ambiente do usuario de iPad.
    # As APIs usadas (HKDF, Cipher/algorithms/modes, padding, hashes) sao
    # estaveis desde as versoes 1.x, entao nao ha ganho em exigir mais.
    "cryptography",

    "keyring",
]

# ----------------------------------------------------------------------
# EXTRAS: features que funcionam sem eles, degradando de forma explicita.
# Tudo que e' COMPILADO e substituivel mora aqui, pra que o `pip install
# qobuz-dl-ultra` puro-Python funcione em ambiente restrito (a-Shell).
#
# Em desktop/servidor, use `pip install "qobuz-dl-ultra[all]"` pra ter
# exatamente o comportamento de antes desta reorganizacao.
# ----------------------------------------------------------------------
[project.optional-dependencies]
speed = [
    "rapidfuzz",  # COMPILADO (C++/Cython). Usado em qopy.py e cli.py para
                  # similaridade de texto. Sem ele, qobuz_dl/fuzzy.py cai
                  # pro difflib da biblioteca padrao: mesma funcionalidade,
                  # mais lento. ANTES ele era import de topo em cli.py, o
                  # que impedia ate' `--help` de rodar sem ele.
    "brotli",  # COMPILADO. httpx descomprime Brotli automaticamente se
               # estiver presente; sem ele o servidor serve outro encoding.
               # Nenhum codigo do projeto o importa diretamente.
]
covers = [
    # COMPILADO. metadata.py o importa dentro da funcao e ja' degrada com
    # aviso claro quando falta: sem Pillow, capa acima do limite de 16MB do
    # FLAC apenas nao e' recompactada (o resto do embed funciona).
    "Pillow>=10.0.0",
]
watch = [
    "watchdog",  # COMPILADO. Somente para a flag --watch.
]
duplicates = [
    # Puro Python, mas exige o binario 'fpcalc' (Chromaprint) instalado no
    # sistema, que NAO vem via pip -- ver utils.checar_binarios_externos().
    "pyacoustid",
]
genius = [
    # BUGFIX: lyrics_engine.py sempre fez `import lyricsgenius` protegido
    # por try/except, mas o pacote nao era declarado em lugar nenhum. Ou
    # seja: a busca de letras no Genius NUNCA funcionava numa instalacao
    # limpa, e falhava em silencio. Agora e' um extra explicito.
    #
    # Piso de versao por causa do Python: a 3.12.x exige Python >=3.11, e
    # este projeto suporta 3.10. O marcador deixa o pip escolher.
    "lyricsgenius>=3.0; python_version >= '3.11'",
    "lyricsgenius>=3.0,<3.7.4; python_version < '3.11'",
]
all = [
    "qobuz-dl-ultra[speed,covers,watch,duplicates,genius]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",  # permite testar toda a camada de rede (qopy,
                           # lyrics_engine, downloader) sem tocar na API
                           # real do Qobuz
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Repository = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Issues = "https://github.com/kaduvercosa/qobuz-dl-ultra/issues"

[project.scripts]
qobuz-dl = "qobuz_dl:main"
qdl = "qobuz_dl:main"

[tool.setuptools.dynamic]
version = { attr = "qobuz_dl.__version__" }

[tool.setuptools.packages.find]
include = ["qobuz_dl*"]
# ----------------------------------------------------------------------
# Configuracao do pytest. Antes a pasta tests/ tinha apenas scripts soltos
# rodados a mao (`python tests/test_x.py`), com verificacao visual do
# resultado -- e um deles chamava `sys.exit()` no nivel do modulo, o que
# derrubava a coleta do pytest inteira com INTERNALERROR.
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Ignora tests/manual/: aqueles scripts precisam de credenciais reais do
# Qobuz e de rede, entao nao pertencem a suite automatizada (ver o README
# de la').
norecursedirs = ["manual", ".git", "__pycache__", "build", "dist"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: abre subprocesso do programa; mais lento que os testes de unidade",
]
# `asyncio_mode = auto` deixa escrever `async def test_...` sem decorar cada
# um -- boa parte do projeto e' assincrona (qopy, downloader, db).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
