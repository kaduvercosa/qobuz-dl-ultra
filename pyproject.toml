[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-dl-ultra"
dynamic = ["version"]
description = "The Ultimate Lossless and Hi-Res music downloader for Qobuz with ReplayGain and Classical metadata"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "Eduardo (kaduvercosa)", email = "kaduvercosa@users.noreply.github.com" }
]

keywords = [
    "qobuz",
    "music",
    "downloader",
    "flac",
    "hi-res",
    "lossless"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent"
]

dependencies = [
    "pathvalidate",
    "httpx",
    "brotli",  # httpx descomprime Brotli automaticamente se isto estiver
               # instalado -- APIs modernas (Qobuz inclusa) costumam servir
               # JSON em Brotli quando o cliente anuncia suporte. Sem
               # codigo novo necessario, so precisa estar presente.
    "aiosqlite",  # ver db.py: handle_download_id() e' chamado por
                  # faixa/album baixado, sqlite3 sincrono travava o event
                  # loop a cada escrita
    "rapidfuzz",  # ver qopy.py/cli.py: substitui difflib.SequenceMatcher
                  # (Python puro, lento) por uma implementacao C++/Cython
    "send2trash",  # ver downloader.py: manda arquivos parciais pra
                   # lixeira do SO em vez de apagar de vez
    "humanize",  # formatacao de tamanho/tempo legivel na UI
    "pyacoustid",  # ver sync.py: --find-duplicates, fingerprinting de
                   # audio via Chromaprint. REQUER o binario 'fpcalc' do
                   # Chromaprint instalado no sistema (fora do pip).
    "watchdog",  # ver watcher.py: --watch, retro-tagging automatico
    "aiofiles",
    "tenacity",
    "platformdirs",
    "charset_normalizer",
    "mutagen",
    "tqdm",
    "beautifulsoup4",
    "colorama",
    "cryptography",
    "keyring",
    "questionary",
    "prompt_toolkit",
    "Pillow>10.0.0"
]

[project.urls]
Homepage = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Repository = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Issues = "https://github.com/kaduvercosa/qobuz-dl-ultra/issues"

[project.scripts]
qobuz-dl = "qobuz_dl:main"
qdl = "qobuz_dl:main"

[tool.setuptools.dynamic]
version = { attr = "qobuz_dl.__version__" }

[tool.setuptools.packages.find]
include = ["qobuz_dl*"]