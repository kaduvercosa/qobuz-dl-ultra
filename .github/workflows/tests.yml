name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

jobs:
  tests:
    name: Testes (pytest) - ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Instala o projeto com as dependências de dev
        run: python -m pip install --upgrade pip && pip install -e ".[all, dev]"
      - name: Roda a suíte de testes (pula os marcados "slow")
        id: pytest
        continue-on-error: true
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        shell: bash
        run: pytest -m "not slow" -q > pytest_saida.log 2>&1
      - name: Roda a suíte de testes com cobertura (job de referência)
        id: pytest_cov
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: >
          pytest -m "not slow" -q
          --cov=qobuz_dl --cov-fail-under=47 --cov-report=xml --cov-report=term-missing
          > pytest_saida.log 2>&1
      - name: Mostra a saída do pytest no resumo do run
        if: always()
        shell: bash
        run: cat pytest_saida.log
      - name: Envia cobertura para o Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Monta o resumo do que falhou
        id: resumo
        if: steps.pytest.outcome == 'failure' || steps.pytest_cov.outcome == 'failure'
        shell: bash
        run: |
          ASSUNTO="🚨 qobuz-dl-ultra: testes falharam (${{ matrix.os }} / py${{ matrix.python-version }})"
          echo "assunto=$ASSUNTO" >> "$GITHUB_OUTPUT"
          {
            echo "corpo<<FIM_DO_CORPO"
            echo "A suíte de testes falhou em ${{ matrix.os }} / Python ${{ matrix.python-version }}."
            echo
            echo "Saída do pytest:"
            echo "-----------------------------------------------------------"
            tail -c 4000 pytest_saida.log
            echo "-----------------------------------------------------------"
            echo
            echo "Log completo do run:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "FIM_DO_CORPO"
          } >> "$GITHUB_OUTPUT"
      - name: Envia e-mail com o erro exato (só se os testes falharam)
        if: steps.resumo.outcome == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.resumo.outputs.assunto }}
          to: ${{ secrets.EMAIL_TO }}
          from: CI qobuz-dl-ultra
          body: ${{ steps.resumo.outputs.corpo }}
      - name: Marca o job como falho (se os testes falharam)
        if: steps.pytest.outcome == 'failure' || steps.pytest_cov.outcome == 'failure'
        shell: bash
        run: exit 1

  auditoria-dependencias:
    name: Auditoria de segurança das dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instala as dependências externas e o pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install \
            pathvalidate \
            httpx \
            aiosqlite \
            send2trash \
            humanize \
            aiofiles \
            tenacity \
            platformdirs \
            charset_normalizer \
            mutagen \
            tqdm \
            prompt_toolkit \
            packaging \
            "colorama>=0.4.6" \
            cryptography \
            keyring \
            rapidfuzz \
            brotli \
            "Pillow>=10.0.0" \
            watchdog \
            pyacoustid \
            "lyricsgenius>=3.0" \
            numpy \
            pip-audit
      - name: Audita as dependências instaladas
        id: audit
        continue-on-error: true
        run: pip-audit --strict > pip_audit_saida.log 2>&1
      - name: Mostra o resultado no resumo do run
        if: always()
        run: cat pip_audit_saida.log
      - name: Monta o resumo do que falhou
        id: resumo
        if: steps.audit.outcome == 'failure'
        run: |
          {
            echo "corpo<<FIM_DO_CORPO"
            echo "pip-audit encontrou vulnerabilidade(s) conhecida(s) numa dependência instalada:"
            echo
            echo "-----------------------------------------------------------"
            tail -c 4000 pip_audit_saida.log
            echo "-----------------------------------------------------------"
            echo
            echo "Log completo do run:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "FIM_DO_CORPO"
          } >> "$GITHUB_OUTPUT"
      - name: Envia e-mail com a vulnerabilidade exata (só se algo foi encontrado)
        if: steps.resumo.outcome == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔒 qobuz-dl-ultra: vulnerabilidade encontrada numa dependência"
          to: ${{ secrets.EMAIL_TO }}
          from: CI qobuz-dl-ultra
          body: ${{ steps.resumo.outputs.corpo }}
      - name: Marca o job como falho (se alguma vulnerabilidade foi encontrada)
        if: steps.audit.outcome == 'failure'
        run: exit 1

  verificacao-de-tipos:
    name: Verificação estática de tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instala o projeto, mypy e mypy-baseline
        run: python -m pip install --upgrade pip && pip install -e ".[all]" mypy mypy-baseline
      - name: Roda o mypy (não falha aqui -- a decisão fica pros passos seguintes)
        run: mypy --python-version 3.12 qobuz_dl > mypy_saida.log 2>&1 || true
      - name: Mostra a saída completa do mypy no resumo do run
        run: cat mypy_saida.log
      - name: Sem baseline ainda -- gera um novo com os apontamentos atuais
        id: gera_baseline
        if: hashFiles('mypy-baseline.txt') == ''
        run: |
          cat mypy_saida.log | mypy-baseline sync || true
          echo "::warning::mypy-baseline.txt não existia -- gerei um novo com os apontamentos atuais do mypy. Baixe o artefato 'mypy-baseline' desta execução, salve como mypy-baseline.txt na raiz do projeto e faça commit. A partir da próxima execução, só erros NOVOS vão falhar o CI."
      - name: Sobe o baseline gerado como artefato pra download
        if: steps.gera_baseline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mypy-baseline
          path: mypy-baseline.txt
          if-no-files-found: warn
      - name: Compara contra o baseline existente (só roda se já houver um)
        id: mypy_filter
        if: hashFiles('mypy-baseline.txt') != ''
        continue-on-error: true
        run: cat mypy_saida.log | mypy-baseline filter
      - name: Marca o job como falho (só se havia baseline E apareceu erro novo)
        if: hashFiles('mypy-baseline.txt') != '' && steps.mypy_filter.outcome == 'failure'
        run: exit 1
