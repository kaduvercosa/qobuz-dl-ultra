name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

jobs:
  tests:
    name: Testes (pytest) - ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instala o projeto com as dependências de dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all, dev]"

      - name: Roda a suíte de testes (pula os marcados "slow")
        id: pytest
        continue-on-error: true
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        shell: bash
        run: |
          pytest -m "not slow" -q > pytest_saida.log 2>&1

      - name: Roda a suíte de testes com cobertura (job de referência)
        id: pytest_cov
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          pytest -m "not slow" -q \
            --cov=qobuz_dl \
            --cov-fail-under=47 \
            --cov-report=xml \
            --cov-report=term-missing \
            > pytest_saida.log 2>&1

      - name: Mostra a saída do pytest no resumo do run
        if: always()
        shell: bash
        run: |
          if [ -f pytest_saida.log ]; then
            cat pytest_saida.log
            {
              echo "## Saída do pytest"
              echo
              echo '```text'
              cat pytest_saida.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Envia cobertura para o Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Monta o resumo do que falhou
        id: resumo
        if: steps.pytest.outcome == 'failure' || steps.pytest_cov.outcome == 'failure'
        shell: bash
        run: |
          assunto="🚨 qobuz-dl-ultra: testes falharam (${{ matrix.os }} / py${{ matrix.python-version }})"
          {
            echo "assunto=$assunto"
            echo "corpo<<EOF"
            cat pytest_saida.log
            echo
            echo "Repositório: ${{ github.repository }}"
            echo "Branch ou tag: ${{ github.ref_name }}"
            echo "Sistema: ${{ matrix.os }}"
            echo "Python: ${{ matrix.python-version }}"
            echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Envia e-mail com o erro exato (só se os testes falharam)
        if: steps.resumo.outcome == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.resumo.outputs.assunto }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          secure: true
          body: ${{ steps.resumo.outputs.corpo }}
          attachments: pytest_saida.log

      - name: Marca o job como falho (se os testes falharam)
        if: steps.pytest.outcome == 'failure' || steps.pytest_cov.outcome == 'failure'
        shell: bash
        run: exit 1

  auditoria-dependencias:
    name: Auditoria de segurança das dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instala o projeto e o pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install pip-audit

      - name: Gera lista das dependências externas
        shell: bash
        run: |
          python -m pip freeze \
            | grep -v '^qobuz-dl-ultra==' \
            > requirements-audit.txt
          test -s requirements-audit.txt

      - name: Audita as dependências instaladas
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          pip-audit \
            --strict \
            -r requirements-audit.txt \
            > pip_audit_saida.log 2>&1

      - name: Mostra o resultado no resumo do run
        if: always()
        shell: bash
        run: |
          cat pip_audit_saida.log
          {
            echo "## Resultado do pip-audit"
            echo
            echo '```text'
            cat pip_audit_saida.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sobe o relatório da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: |
            pip_audit_saida.log
            requirements-audit.txt
          if-no-files-found: warn

      - name: Monta o resumo do que falhou
        id: resumo
        if: steps.audit.outcome == 'failure'
        shell: bash
        run: |
          assunto="🔒 qobuz-dl-ultra: vulnerabilidade encontrada numa dependência"
          {
            echo "assunto=$assunto"
            echo "corpo<<EOF"
            cat pip_audit_saida.log
            echo
            echo "Repositório: ${{ github.repository }}"
            echo "Branch ou tag: ${{ github.ref_name }}"
            echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Envia e-mail com a vulnerabilidade exata (só se algo foi encontrado)
        if: steps.resumo.outcome == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.resumo.outputs.assunto }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          secure: true
          body: ${{ steps.resumo.outputs.corpo }}
          attachments: pip_audit_saida.log

      - name: Marca o job como falho (se alguma vulnerabilidade foi encontrada)
        if: steps.audit.outcome == 'failure'
        shell: bash
        run: exit 1

  verificacao-de-tipos:
    name: Verificação estática de tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instala o projeto, mypy e mypy-baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" mypy mypy-baseline

      - name: Roda o mypy (não falha aqui -- a decisão fica pros passos seguintes)
        shell: bash
        run: |
          mypy --python-version 3.12 qobuz_dl > mypy_saida.log 2>&1 || true

      - name: Mostra a saída completa do mypy no resumo do run
        if: always()
        shell: bash
        run: |
          cat mypy_saida.log
          {
            echo "## Saída do mypy"
            echo
            echo '```text'
            cat mypy_saida.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sem baseline ainda -- gera um novo com os apontamentos atuais
        id: gera_baseline
        if: hashFiles('mypy-baseline.txt') == ''
        shell: bash
        run: |
          cat mypy_saida.log | mypy-baseline sync || true
          echo "::warning::mypy-baseline.txt não existia -- gerei um novo com os apontamentos atuais do mypy. Baixe o artefato 'mypy-baseline' desta execução, salve como mypy-baseline.txt na raiz do projeto e faça commit. A partir da próxima execução, só erros NOVOS vão falhar o CI."

      - name: Sobe o baseline gerado como artefato pra download
        if: steps.gera_baseline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mypy-baseline
          path: mypy-baseline.txt
          if-no-files-found: warn

      - name: Compara contra o baseline existente (só roda se já houver um)
        id: mypy_filter
        if: hashFiles('mypy-baseline.txt') != ''
        continue-on-error: true
        shell: bash
        run: |
          cat mypy_saida.log | mypy-baseline filter

      - name: Marca o job como falho (só se havia baseline E apareceu erro novo)
        if: hashFiles('mypy-baseline.txt') != '' && steps.mypy_filter.outcome == 'failure'
        shell: bash
        run: exit 1
