name: Lint

# Este workflow é novo. O repo já tinha um .flake8 configurado (max-line-length,
# ignores, etc.), mas nada rodava ele automaticamente — só existia como arquivo
# morto. Aqui ele roda a cada push/PR nas branches master/main.
#
# NOTA sobre testes: test_lyrics.py e test_lyrics_translation.py NÃO entraram
# neste workflow de propósito. Eles são scripts manuais/interativos (usam
# input() e exigem login real no Qobuz via config.ini), não testes
# automatizados de verdade — rodar eles em CI travaria esperando input() e
# falharia por falta de credenciais. Se quiser testes reais de CI no futuro,
# o caminho é escrever testes unitários novos (com pytest + mocks das
# respostas da API), separados desses dois scripts de debug manual.

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  lint:
    name: Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala flake8
        run: python -m pip install --upgrade pip flake8

      - name: Roda flake8 (usa o .flake8 do repo)
        run: flake8 qobuz_dl
