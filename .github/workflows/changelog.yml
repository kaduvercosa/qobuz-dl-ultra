name: Changelog automático

# Dispara em QUALQUER tag (o esquema de tags deste repo é inconsistente --
# tem "v2.5.4", "2.4.5.1", "V1.5.0" misturados -- então filtrar por padrão
# tipo "v*" deixaria escapar metade das tags reais). Roda o gerador de
# changelog (tools/gerar_changelog.py) comparando a tag nova com a tag
# anterior, e publica os resultados como Release RASCUNHO -- não published.
#
# Fluxo pretendido: você cria e empurra a tag (`git tag 2.6.0 && git push
# --tags`) -> este workflow gera o changelog e abre o rascunho -> você
# revisa/edita no GitHub -> clica em "Publish release" -> isso dispara o
# evento "release: published", que já é o gatilho existente do pypi.yml.
# Ou seja: não muda nada do fluxo de publicação que já existe, só
# preenche automaticamente a parte que hoje você escrevia à mão.

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  gerar-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # precisa do histórico inteiro + todas as tags

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Gerar changelog desde a tag anterior
        id: changelog
        run: |
          python tools/gerar_changelog.py --para "${{ github.ref_name }}" -o /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Criar Release rascunho com o changelog gerado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se já existir uma release/rascunho pra essa tag (ex.: workflow
          # re-rodado manualmente), atualiza em vez de falhar tentando
          # criar de novo.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --notes-file /tmp/changelog.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file /tmp/changelog.md \
              --draft
          fi
