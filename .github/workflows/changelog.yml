name: Changelog automático

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para gerar ou regerar o changelog"
        required: true
        type: string

permissions:
  contents: write
  models: read # GitHub Models (GITHUB_TOKEN) entra na cadeia de IAs sem secret extra

env:
  PYTHON_VERSION: "3.12"

jobs:
  gerar-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Definir tag da release
        id: release
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          TAG_PUSH: ${{ github.ref_name }}
          TAG_MANUAL: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENTO" == "workflow_dispatch" ]]; then
            TAG="$TAG_MANUAL"
          else
            TAG="$TAG_PUSH"
          fi

          if [[ -z "$TAG" ]]; then
            echo "A tag da release não foi definida."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release selecionada: $TAG"

      - name: Encontrar tag anterior
        id: previous
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_PREVIOUS="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"

          if [[ -z "$TAG_PREVIOUS" ]]; then
            echo "Não foi possível encontrar a tag anterior a $TAG."
            echo "Para a primeira release, defina uma tag inicial ou trate esse caso no workflow."
            exit 1
          fi

          echo "tag=$TAG_PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Tag anterior: $TAG_PREVIOUS"

      - name: Gerar changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TAG_PREVIOUS: ${{ steps.previous.outputs.tag }}
          # Cada chave é opcional: só os provedores com chave entram na cadeia
          # (ordem padrão: gemini, groq, openrouter, mistral, cerebras, github).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Opcionais (Settings > Variables): ordem e modelos.
          CHANGELOG_PROVEDORES: ${{ vars.CHANGELOG_PROVEDORES }}
          CHANGELOG_MODELO: ${{ vars.CHANGELOG_MODELO }}
          CHANGELOG_MODELO_RESERVA: ${{ vars.CHANGELOG_MODELO_RESERVA }}
        shell: bash
        run: |
          set -euo pipefail

          ATIVOS=0
          for NOME in GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY \
                      MISTRAL_API_KEY CEREBRAS_API_KEY GITHUB_TOKEN; do
            if [[ -n "${!NOME:-}" ]]; then
              echo "$NOME: configurada"
              ATIVOS=$((ATIVOS + 1))
            else
              echo "$NOME: ausente"
            fi
          done
          if [[ "$ATIVOS" -eq 0 ]]; then
            echo "::warning::nenhuma chave de IA configurada; o changelog sairá pelos títulos dos commits"
          fi

          ARGS=(--de "$TAG_PREVIOUS" --para "$TAG" --versao "$TAG"
                --data "$(date -u +%F)" --output /tmp/changelog.md)
          if [[ -n "${CHANGELOG_MODELO:-}" ]]; then
            ARGS+=(--modelo "$CHANGELOG_MODELO")
          fi

          if [[ -n "${CHANGELOG_MODELO_RESERVA:-}" ]]; then
            ARGS+=(--modelo-reserva "$CHANGELOG_MODELO_RESERVA")
          fi

          python tools/gerar_changelog.py "${ARGS[@]}"

          test -s /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Criar release rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # `gh release view/edit` não enxergam rascunhos pela tag, então o
          # rascunho (se já existir) é procurado pela API. Rascunho ainda não foi
          # publicado: dá para regerar as notas à vontade (útil ao testar o
          # changelog com IA). Release publicada nunca é mexida.
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' | head -n1)"

          if [[ -n "$RELEASE_ID" ]]; then
            echo "Release $TAG é um rascunho; atualizando as notas."
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f body="$(cat /tmp/changelog.md)" >/dev/null
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já foi publicada; não será sobrescrita."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/changelog.md \
            --draft
