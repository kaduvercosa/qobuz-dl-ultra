name: Changelog automático

# Gera notas de versão no formato Keep a Changelog quando uma tag é enviada.
# O resultado é criado como release rascunho para revisão manual antes da
# publicação.

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para gerar/regerar o changelog"
        required: true
        type: string

permissions:
  contents: write

jobs:
  gerar-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Definir tag da release
        id: release
        env:
          EVENTO: ${{ github.event_name }}
          TAG_PUSH: ${{ github.ref_name }}
          TAG_MANUAL: ${{ inputs.tag }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "tag=$TAG_MANUAL" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG_PUSH" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python tools/gerar_changelog.py \
            --para "$TAG" \
            --versao "$TAG" \
            --data "$(date -u +%F)" \
            -o /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Criar ou atualizar release rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/changelog.md \
              --draft
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/changelog.md \
              --draft
          fi
