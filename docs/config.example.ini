; ==============================================================================
; config.example.ini - modelo COMENTADO do config.ini do qobuz-dl-ultra
;
; Isto é um modelo: NÃO copie por cima do seu config.ini (ele tem seu login).
; Copie só as linhas que quiser para a seção [qobuz] do seu arquivo.
; Para achar o seu: qobuz-dl config path
; Mudar uma opção sem abrir o arquivo: qobuz-dl config set CHAVE VALOR
; (credenciais e as chaves de hooks marcadas abaixo não passam por aí).
;
; Precedência: flag da linha de comando > variável de ambiente (só hooks:
; QOBUZ_DL_<CHAVE>) > este arquivo > padrão do programa.
; Valores verdadeiro/falso: true ou false.
; Variáveis de pasta e de arquivo: veja docs/TEMPLATES.md
; Eventos e hooks: veja docs/EVENTOS_E_HOOKS.md
; ==============================================================================

[qobuz]

; ---- Pasta e qualidade ------------------------------------------------------
; Pasta dos downloads.
default_folder = QobuzDownloads
; 5 = MP3 320 | 6 = FLAC 16/44.1 | 7 = FLAC 24 ate 96 kHz | 27 = FLAC 24 acima de 96 kHz
default_quality = 6
; Se a qualidade pedida não existir, baixa a melhor disponível (false = pula).
no_fallback = false

; ---- Nomes de pasta e de arquivo -------------------------------------------
; "/" cria subpastas. Chaves literais: {{ e }}.
folder_format = {release_type}/{album_artist} - {album_title} ({year}) [{quality_tag}]
; Só o nome do arquivo (sem "/"). As variáveis são outras que as da pasta.
track_format = {track_number}. {track_title_base} {explicit}
; Usado quando o formato principal da pasta falha.
fallback_folder_format = {release_type}/{album_artist} - {album_title} ({year}) [{quality_tag}]
; Álbuns com vários discos: prefixo da subpasta (CD 01), tudo numa pasta só, e o nome do arquivo nesse caso.
multiple_disc_prefix = CD
multiple_disc_one_dir = false
multiple_disc_track_format = {disc_number}.{track_number} - {track_title_base}
; Número da faixa seguido (1 a N) nas TAGS de álbuns com vários discos.
continuous_track_numbers = false

; ---- Capas, letras e metadados ---------------------------------------------
embed_art = true
no_cover = false
; Tamanho da capa salva e da embutida: 50, 100, 150, 300, 600, max ou org.
saved_art_size = org
embedded_art_size = org
fetch_lyrics = false
embed_lyrics = true
; Idioma da tradução de letras (se houver).
lyrics_translation_lang = pt
musicbrainz = false
verify_after_download = false

; ---- Desempenho -------------------------------------------------------------
; Downloads em paralelo (1 = um de cada vez).
max_workers = 1
check_storage = true

; ---- Banco de dados e dedup -------------------------------------------------
no_database = false
write_sentinel = true

; ---- Tela -------------------------------------------------------------------
; auto, cartao, compacto ou tabela
interactive_layout = auto

; ==============================================================================
; EVENTOS E HOOKS (tudo desligado por padrão: apague o ";" só do que quiser)
; ==============================================================================

; ---- Eventos em JSON, uma linha por evento ---------------------------------
; Caminho de um arquivo (modo append) ou "-" para o stderr.
;events_file = ~/qobuz-eventos.ndjson

; ---- Comandos (rodam no shell; dados em QOBUZ_DL_* e JSON no stdin) --------
; Ao concluir cada album/faixa/playlist:
;on_complete = notify-send "$QOBUZ_DL_ARTISTA" "$QOBUZ_DL_TITULO"
; Quando um lançamento termina incompleto:
;on_error = echo "incompleto: $QOBUZ_DL_TITULO" >> ~/qobuz-erros.log
; Uma vez, no fim da sessão:
;on_finish = echo "$QOBUZ_DL_FAIXAS_NOVAS faixas novas" >> ~/qobuz.log
; Prazo de cada comando e de cada chamada HTTP, em segundos.
;hook_timeout = 60
;hook_http_timeout = 10

; ---- Webhook (POST em JSON) --------------------------------------------------
; (credencial: edite aqui ou use QOBUZ_DL_WEBHOOK_URL / QOBUZ_DL_WEBHOOK_SECRET)
;webhook_url = https://exemplo.com/qobuz
;webhook_secret = troque-por-um-segredo-longo
; Eventos enviados: sessao_iniciada, lancamento_iniciado, faixa, lancamento_concluido, sessao_concluida
;webhook_events = lancamento_concluido,sessao_concluida

; ---- ntfy (notificação no celular) ------------------------------------------
; Tópico (ntfy.sh) ou URL do seu servidor. O tópico funciona como senha: escolha um difícil de adivinhar.
;ntfy = meu-topico-dificil-de-adivinhar
;ntfy_token =
;ntfy_events = sessao_concluida

; ---- Reescanear o servidor de música (só se baixou arquivo novo) ------------
; Servidores: navidrome (ou subsonic), plex, jellyfin. Separe com vírgula.
;rescan = navidrome
;subsonic_url = http://nas:4533
;subsonic_user = usuario
;subsonic_password =
;plex_url = http://nas:32400
;plex_token =
; Número da biblioteca no Plex (vários: 3,5). Veja /library/sections no seu servidor.
;plex_section = 3
;jellyfin_url = http://nas:8096
;jellyfin_api_key =
